<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scavenger Hunt</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 42rem;
      margin: 0 auto;
      padding: 1.25rem;
      line-height: 1.5;
      color: #202020;
      background: #fafafa;
    }

    input, select, button {
      box-sizing: border-box;
      font: inherit;
      padding: 0.75rem;
      margin: 0.3rem 0;
      width: 100%;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
    }

    section, .card {
      border: 1px solid #ddd;
      border-radius: 0.6rem;
      background: white;
      padding: 1rem;
      margin: 1rem 0;
    }

    [hidden] {
      display: none !important;
    }

    #message {
      min-height: 1.5rem;
      white-space: pre-wrap;
    }

    #answer-feedback {
      margin: 0.25rem 0 0.75rem;
      padding: 0.7rem 0.85rem;
      border-left: 4px solid #b42318;
      background: #fff0ee;
      color: #7a1711;
      font-weight: 700;
    }

    #clue, .hint-text {
      white-space: pre-wrap;
    }

    #timing {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <h1>Scavenger Hunt</h1>

  <p id="message" role="status" aria-live="polite"></p>

  <section id="login-section">
    <h2>Team sign-in</h2>
    <p id="login-message" role="status" aria-live="polite">
      Scan your team login QR code to sign in.
    </p>
  </section>

  <main id="game-section" hidden>
    <p id="signed-in"></p>

    <p id="station-prompt" role="status" aria-live="polite" hidden>
      Scan a station QR code to open its challenge.
    </p>

    <button id="refresh-button" hidden>Refresh challenge</button>

    <section id="challenge-content" hidden>
      <h2 id="challenge-title">Challenge</h2>

      <div id="pre-start" hidden>
        <p>
          Gather your team and prepare your materials.
          The timer starts when you press Start.
        </p>
        <button id="start-button">Start challenge</button>
      </div>

      <div id="attempt-section" hidden>
        <p id="timing"></p>
        <p id="completion"></p>

        <h3>Clue</h3>
        <div id="clue"></div>

        <h3>Hints</h3>
        <div id="hints"></div>
        <button id="hint-button" hidden></button>

        <form id="answer-form">
          <label for="answer">Your answer</label>
          <input id="answer" autocomplete="off" maxlength="200" required>
          <p id="answer-feedback" role="status" aria-live="polite" hidden></p>
          <button type="submit">Submit answer</button>
        </form>
      </div>
    </section>

    <button id="logout-button">Sign out</button>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
